services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Docker-internal Redis URL overrides the localhost value in .env
      REDIS_URL: "redis://redis:6379"
      CHROMA_DB_PATH: "/data/chroma_db"
    volumes:
      - chroma_data:/data/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    command: "${API_CMD:-sh -c 'python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000'}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chroma_data:
  redis_data:
