AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Uploader Lab — Storage stack. Private S3 bucket for uploaded photos,
  served exclusively through a CloudFront distribution using Origin Access
  Control (OAC). The bucket has no public access of any kind — the bucket
  policy grants read access only to this specific CloudFront distribution.
  Trainee: Emmanuel SHYIRAMBERE

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── Photos S3 Bucket ───────────────────────────
  # No BucketPolicy allowing public access, no website hosting config,
  # no ACLs — the only door in is the CloudFront OAC policy below.
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "emmanuel-photo-uploader-photos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-photos

  # ── CloudFront Origin Access Control ───────────
  PhotosOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: emmanuel-photo-uploader-oac
        Description: OAC restricting the photos bucket to this CloudFront distribution only
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Distribution ────────────────────
  PhotosDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: emmanuel-photo-uploader photos CDN
        PriceClass: PriceClass_200
        DefaultCacheBehavior:
          TargetOriginId: PhotosS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized policy — long-lived caching for
          # immutable, UUID-keyed photo objects.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        Origins:
          - Id: PhotosS3Origin
            DomainName: !GetAtt PhotosBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt PhotosOriginAccessControl.Id
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-cdn

  # ── Bucket Policy: CloudFront (this distribution) only ─────
  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PhotosBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PhotosDistribution}"

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  PhotosBucketName:
    Description: S3 bucket name for uploaded photos
    Value: !Ref PhotosBucket
    Export:
      Name: !Sub "${AWS::StackName}-PhotosBucketName"

  PhotosBucketArn:
    Description: S3 bucket ARN for uploaded photos
    Value: !GetAtt PhotosBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PhotosBucketArn"

  CloudFrontDomainName:
    Description: CloudFront distribution domain — use this to view uploaded photos
    Value: !GetAtt PhotosDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDomainName"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref PhotosDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"
