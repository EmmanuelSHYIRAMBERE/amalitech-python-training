AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Uploader Lab — ALB + ECS stack. Public ALB, ECS Fargate service with
  blue/green deployments via CodeDeploy, and target-tracking autoscaling
  (1-4 tasks on CPU).
  Trainee: Emmanuel SHYIRAMBERE
  Depends on: emmanuel-photo-uploader-network (network.yaml),
  emmanuel-photo-uploader-ecr (ecr.yaml), emmanuel-photo-uploader-storage
  (storage.yaml), and emmanuel-photo-uploader-database (database.yaml) —
  their outputs are imported below.

# ─────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────
Parameters:
  NetworkStackName:
    Type: String
    Default: emmanuel-photo-uploader-network

  EcrStackName:
    Type: String
    Default: emmanuel-photo-uploader-ecr

  StorageStackName:
    Type: String
    Default: emmanuel-photo-uploader-storage

  DatabaseStackName:
    Type: String
    Default: emmanuel-photo-uploader-database

  ContainerPort:
    Type: Number
    Default: 3000

  TaskCpu:
    Type: String
    Default: "256"

  TaskMemory:
    Type: String
    Default: "512"

  DjangoSecretKeyArn:
    Type: String
    Description: Secrets Manager ARN holding the Django SECRET_KEY (created out-of-band, not managed by this template).
    Default: arn:aws:secretsmanager:eu-north-1:195275667627:secret:emmanuel-photo-uploader-django-secret-key-mcNg8V

  # TEMPORARY: hardcoded directly (not via Fn::ImportValue from
  # database.yaml) to break the cross-stack dependency during the RDS
  # subnet migration cutover - database.yaml's PostgresInstance now
  # points at the migrated emmanuel-photo-uploader-db-v2 instance, but
  # CloudFormation refuses to let an export's value change while another
  # stack's template still references it, even if the referencing
  # resource itself wouldn't be touched. Revert to Fn::ImportValue once
  # both stacks are confirmed stable on the new instance.
  DbHostOverride:
    Type: String
    Default: emmanuel-photo-uploader-db-v2.cx8e66g2o0sx.eu-north-1.rds.amazonaws.com

  DbSecretArnOverride:
    Type: String
    Default: arn:aws:secretsmanager:eu-north-1:195275667627:secret:rds!db-2526f8eb-070a-4158-846d-a8babef90640-BhAf96

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── Application Load Balancer ─────────────────
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: emmanuel-photo-uploader-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSecurityGroupId"
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-alb

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: emmanuel-photo-uploader-tg-blue
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-tg-blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: emmanuel-photo-uploader-tg-green
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-tg-green

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ── ECS Cluster ────────────────────────────────
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: emmanuel-photo-uploader-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-cluster

  # ── CloudWatch Logs ────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/emmanuel-photo-uploader
      RetentionInDays: 14

  # ── IAM: ECS task roles ────────────────────────
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-photo-uploader-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        # ECS resolves the task definition's "secrets" field using this
        # role (not TaskRole) before the container starts.
        - PolicyName: emmanuel-photo-uploader-task-execution-secrets-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DjangoSecretKeyArn
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-task-execution-role

  # TaskRole is what the running application code itself uses - scoped to
  # exactly what this app needs at runtime: write photos to the S3 bucket,
  # and read the auto-generated RDS master password from Secrets Manager.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-photo-uploader-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: emmanuel-photo-uploader-task-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - Fn::Sub:
                      - "${BucketArn}/*"
                      - BucketArn:
                          Fn::ImportValue: !Sub "${StorageStackName}-PhotosBucketArn"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecretArnOverride
              # Required for ECS Exec (aws ecs execute-command) -- without
              # this, the SSM agent inside the container can never open its
              # control/data channel, even if the VPC path to SSM exists.
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-task-role

  # ── ECS Task Definition ────────────────────────
  # Image reference here is a bootstrap placeholder only. Once the ECS
  # service uses DeploymentController: CODE_DEPLOY, CloudFormation can
  # never again update the task definition/service directly (AWS rejects
  # it) - every real deployment after the first must go through
  # CodeDeploy via taskdef.json.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: emmanuel-photo-uploader-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: photo-uploader-app
          Image:
            Fn::Sub:
              - "${RepositoryUri}:latest"
              - RepositoryUri:
                  Fn::ImportValue: !Sub "${EcrStackName}-RepositoryUri"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref ContainerPort
            - Name: NODE_ENV
              Value: production
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PHOTOS_BUCKET
              Value:
                Fn::ImportValue: !Sub "${StorageStackName}-PhotosBucketName"
            - Name: CLOUDFRONT_DOMAIN
              Value:
                Fn::ImportValue: !Sub "${StorageStackName}-CloudFrontDomainName"
            - Name: DB_HOST
              Value: !Ref DbHostOverride
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub "${DatabaseStackName}-DbEndpointPort"
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub "${DatabaseStackName}-DbName"
            - Name: DB_USER
              Value:
                Fn::ImportValue: !Sub "${DatabaseStackName}-DbMasterUsername"
            - Name: DB_SECRET_ARN
              Value: !Ref DbSecretArnOverride
            - Name: ALLOWED_HOSTS
              Value: "*"
            - Name: DEBUG
              Value: "false"
          Secrets:
            - Name: SECRET_KEY
              ValueFrom: !Sub "${DjangoSecretKeyArn}:SECRET_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ── ECS Service (blue/green via CodeDeploy) ───
  EcsServiceV2:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: emmanuel-photo-uploader-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetEcs1Id"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetEcs2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-EcsTaskSecurityGroupId"
      LoadBalancers:
        - ContainerName: photo-uploader-app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-service

  # ── Auto Scaling (target tracking on CPU, 1-4 tasks) ──
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: 1
      MaxCapacity: 4
      ResourceId: !Sub "service/${EcsCluster}/${EcsServiceV2.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: emmanuel-photo-uploader-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 50.0

  # ── IAM: CodeDeploy service role ──────────────
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-photo-uploader-codedeploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-codedeploy-role

  # ── CodeDeploy Application + Deployment Group ─
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: emmanuel-photo-uploader-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: emmanuel-photo-uploader-deployment-group
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt EcsServiceV2.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref AlbListener
            TargetGroups:
              - Name: !GetAtt BlueTargetGroup.TargetGroupName
              - Name: !GetAtt GreenTargetGroup.TargetGroupName

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  AlbDnsName:
    Description: ALB DNS name — use this to access the running application
    Value: !Sub "http://${Alb.DNSName}"

  AlbListenerArn:
    Value: !Ref AlbListener
    Export:
      Name: !Sub "${AWS::StackName}-AlbListenerArn"

  EcsClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "${AWS::StackName}-EcsClusterName"

  EcsServiceName:
    Value: !GetAtt EcsServiceV2.Name
    Export:
      Name: !Sub "${AWS::StackName}-EcsServiceName"

  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub "${AWS::StackName}-CodeDeployApplicationName"

  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup
    Export:
      Name: !Sub "${AWS::StackName}-CodeDeployDeploymentGroupName"

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskExecutionRoleArn"

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskRoleArn"

  CodeDeployServiceRoleArn:
    Value: !GetAtt CodeDeployServiceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CodeDeployServiceRoleArn"
