AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Uploader Lab — Database stack. RDS PostgreSQL instance (db.t3
  family) in the private subnets, with an AWS-managed master password
  stored in Secrets Manager — no password ever appears in this template,
  a parameter, or a GitHub secret. The ECS task role is granted read-only
  access to the generated secret at runtime.
  Trainee: Emmanuel SHYIRAMBERE
  Depends on: emmanuel-photo-uploader-network (network.yaml) — its
  outputs are imported below via Fn::ImportValue.

# ─────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────
Parameters:
  NetworkStackName:
    Type: String
    Default: emmanuel-photo-uploader-network

  DbInstanceClass:
    Type: String
    Default: db.t3.micro

  DbName:
    Type: String
    Default: photouploader

  DbMasterUsername:
    Type: String
    Default: photoapp

  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Allocated storage in GiB.

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── DB Subnet Group ────────────────────────────
  # Imported from an out-of-band snapshot-restore migration: the live
  # subnet group is named emmanuel-photo-uploader-db-subnet-group-v2 (not
  # auto-generated by CloudFormation), created manually while moving RDS
  # into its own dedicated subnets. DBSubnetGroupName pins the import to
  # that exact physical resource.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy: Retain
    Properties:
      DBSubnetGroupName: emmanuel-photo-uploader-db-subnet-group-v2
      DBSubnetGroupDescription: Dedicated subnets for the Photo Uploader RDS instance (v2, DB-only)
      SubnetIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetDb1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetDb2Id"
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-db-subnet-group

  # ── RDS PostgreSQL Instance ─────────────────────
  # ManageMasterUserPassword lets RDS itself generate and rotate the
  # master password, stored as a new Secrets Manager secret - the
  # password is never visible in this template, the console, or a
  # parameter value.
  #
  # Imported from an out-of-band snapshot-restore migration: the original
  # instance (emmanuel-photo-uploader-db) could not be moved to its own
  # dedicated subnets in place - RDS refuses to drop a subnet from a
  # DBSubnetGroup while its ENI is still active there, and neither a
  # reboot nor a stop/start forced relocation. A final snapshot was
  # restored as emmanuel-photo-uploader-db-v2, created directly in the
  # new DB-only subnets, and this resource now represents that instance.
  PostgresInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: emmanuel-photo-uploader-db-v2
      Engine: postgres
      EngineVersion: "16.13"
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      DBName: !Ref DbName
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-DbSecurityGroupId"
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: emmanuel-photo-uploader-db

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  DbEndpointAddress:
    Description: RDS PostgreSQL endpoint hostname
    Value: !GetAtt PostgresInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DbEndpointAddress"

  DbEndpointPort:
    Description: RDS PostgreSQL endpoint port
    Value: !GetAtt PostgresInstance.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-DbEndpointPort"

  DbName:
    Description: Database name
    Value: !Ref DbName
    Export:
      Name: !Sub "${AWS::StackName}-DbName"

  DbMasterUsername:
    Description: Database master username
    Value: !Ref DbMasterUsername
    Export:
      Name: !Sub "${AWS::StackName}-DbMasterUsername"

  DbSecretArn:
    Description: Secrets Manager secret ARN holding the auto-generated master password
    Value: !GetAtt PostgresInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DbSecretArn"
