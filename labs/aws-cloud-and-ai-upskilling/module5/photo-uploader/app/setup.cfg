[tool:pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = photos,core
omit =
    */migrations/*
    manage.py
    config/wsgi.py

[mypy]
ignore_missing_imports = True
exclude = migrations
