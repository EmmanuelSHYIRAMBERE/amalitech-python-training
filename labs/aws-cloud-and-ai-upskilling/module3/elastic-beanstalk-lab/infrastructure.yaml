AWSTemplateFormatVersion: "2010-09-09"
Description: Elastic Beanstalk Lab — DynamoDB table + S3 deployment bucket

Resources:

  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: emmanuel-eb-lab-deployments
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBundles
            Status: Enabled
            ExpirationInDays: 30

  VisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eb-lab-visits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: visitId
          AttributeType: S
      KeySchema:
        - AttributeName: visitId
          KeyType: HASH

  EBInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-eb-lab-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
      Policies:
        - PolicyName: DynamoDBVisitsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt VisitsTable.Arn

  EBInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: emmanuel-eb-lab-instance-profile
      Roles:
        - !Ref EBInstanceRole

Outputs:
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  VisitsTableName:
    Value: !Ref VisitsTable
  InstanceProfileName:
    Value: !Ref EBInstanceProfile
