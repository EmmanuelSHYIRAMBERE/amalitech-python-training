AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM Lab - Creates IAM users, groups, and policies with a shared
  temporary password stored in Secrets Manager.

Resources:
  # ─────────────────────────────────────────────
  # 1. ONE-TIME PASSWORD IN SECRETS MANAGER
  # ─────────────────────────────────────────────
  LabTempPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /iam-lab/temp-password
      Description: Shared temporary password for all IAM lab users
      GenerateSecretString:
        SecretStringTemplate: '{"username": "lab-user"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  # ─────────────────────────────────────────────
  # 2. LAB USERS GROUP (self-service password change)
  # ─────────────────────────────────────────────
  LabUsersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: LabUsersGroup
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  # ─────────────────────────────────────────────
  # 3. S3 GROUP + POLICY
  # ─────────────────────────────────────────────
  S3UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3UserGroup

  S3GroupPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: S3ListBucketsPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
            Resource: "*"
      Groups:
        - !Ref S3UserGroup

  # ─────────────────────────────────────────────
  # 4. EC2 GROUP + POLICY
  # ─────────────────────────────────────────────
  EC2UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2UserGroup

  EC2GroupPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EC2ListAndCreatePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:RunInstances
            Resource: "*"
      Groups:
        - !Ref EC2UserGroup

  # ─────────────────────────────────────────────
  # 5. PERMISSIONS BOUNDARY FOR ec2-user2
  # ─────────────────────────────────────────────
  # Caps ec2-user2's effective permissions at Describe*-only, regardless of
  # what the EC2UserGroup policy grants (which includes RunInstances). A
  # permissions boundary is the max-permissions ceiling: effective access is
  # the intersection of identity policies (the group) and this boundary, so
  # RunInstances is blocked without needing a user-level Deny statement.
  EC2User2Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EC2User2NoRunInstancesBoundary
      Description: Permissions boundary capping ec2-user2 below RunInstances
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: "*"
          - Effect: Allow
            Action:
              - iam:ChangePassword
            Resource: "*"

  # ─────────────────────────────────────────────
  # 6. IAM USERS
  # ─────────────────────────────────────────────

  # ec2-user1: full EC2 group access
  EC2User1:
    Type: AWS::IAM::User
    DependsOn: LabTempPassword
    Properties:
      UserName: ec2-user1
      Groups:
        - !Ref EC2UserGroup
        - !Ref LabUsersGroup
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref LabTempPassword
        PasswordResetRequired: true

  # ec2-user2: EC2 group, but capped by a permissions boundary so
  # RunInstances is denied even though the group policy allows it
  EC2User2:
    Type: AWS::IAM::User
    DependsOn: LabTempPassword
    Properties:
      UserName: ec2-user2
      Groups:
        - !Ref EC2UserGroup
        - !Ref LabUsersGroup
      PermissionsBoundary: !Ref EC2User2Boundary
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref LabTempPassword
        PasswordResetRequired: true

  # s3-user: S3 group only
  S3User:
    Type: AWS::IAM::User
    DependsOn: LabTempPassword
    Properties:
      UserName: s3-user
      Groups:
        - !Ref S3UserGroup
        - !Ref LabUsersGroup
      LoginProfile:
        Password: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn: !Ref LabTempPassword
        PasswordResetRequired: true

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  TempPasswordSecretArn:
    Description: ARN of the Secrets Manager secret holding the temp password
    Value: !Ref LabTempPassword

  S3GroupName:
    Description: IAM Group for S3 users
    Value: !Ref S3UserGroup

  EC2GroupName:
    Description: IAM Group for EC2 users
    Value: !Ref EC2UserGroup

  LabUsersGroupName:
    Description: IAM Group granting self-service password change
    Value: !Ref LabUsersGroup

  EC2User2BoundaryArn:
    Description: ARN of the permissions boundary limiting ec2-user2
    Value: !Ref EC2User2Boundary

  ConsoleLoginURL:
    Description: AWS Console login URL
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"
