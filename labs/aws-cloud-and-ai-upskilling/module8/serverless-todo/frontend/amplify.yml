version: 1
# No framework/build step (plain HTML/CSS/JS) — the only "build" work
# is generating config.js from Amplify Console environment variables
# (set per-branch: AWS_REGION, USER_POOL_ID, USER_POOL_CLIENT_ID,
# API_URL), satisfying the lab's "configured via environment variables"
# requirement without baking real resource IDs into the committed
# config.js placeholder.
frontend:
  phases:
    build:
      commands:
        - |
          cat > config.js <<EOF
          window.APP_CONFIG = {
            region: "${AWS_REGION}",
            userPoolId: "${USER_POOL_ID}",
            userPoolClientId: "${USER_POOL_CLIENT_ID}",
            apiUrl: "${API_URL}",
          };
          EOF
  artifacts:
    baseDirectory: /
    files:
      - "**/*"
  cache:
    paths: []
