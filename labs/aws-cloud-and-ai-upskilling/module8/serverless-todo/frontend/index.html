<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverless To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth-view" class="view">
    <div class="card">
      <h1>Serverless To-Do</h1>

      <form id="signin-form" class="form">
        <h2>Sign In</h2>
        <input type="email" id="signin-email" placeholder="Email" required />
        <input type="password" id="signin-password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p class="error" id="signin-error"></p>
      </form>

      <form id="signup-form" class="form">
        <h2>Sign Up</h2>
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password (min 8 chars, upper/lower/number)" required />
        <button type="submit">Sign Up</button>
        <p class="error" id="signup-error"></p>
        <p class="hint">New accounts are auto-confirmed — sign in immediately after signing up.</p>
      </form>
    </div>
  </div>

  <div id="app-view" class="view hidden">
    <header>
      <h1>My Tasks</h1>
      <button id="signout-btn">Sign Out</button>
    </header>

    <form id="task-form" class="task-form">
      <input type="text" id="task-description" placeholder="New task description" required />
      <input type="date" id="task-date" />
      <button type="submit">Add Task</button>
    </form>

    <div class="columns">
      <section>
        <h2>Pending</h2>
        <ul id="pending-list" class="task-list"></ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-list" class="task-list"></ul>
      </section>
      <section>
        <h2>Expired</h2>
        <ul id="expired-list" class="task-list"></ul>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
