AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ECS CI/CD Lab — Application platform stack. ECR repository, public ALB,
  ECS Fargate service with blue/green deployments via CodeDeploy, target
  tracking autoscaling (1-4 tasks on CPU), CodePipeline triggered by
  EventBridge on new ECR image pushes.
  Trainee: Emmanuel SHYIRAMBERE
  Depends on: the emmanuel-ecs-lab-network stack (network.yaml) — its
  outputs are imported below via Fn::ImportValue.

# ─────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────
Parameters:
  NetworkStackName:
    Type: String
    Default: emmanuel-ecs-lab-network
    Description: Name of the deployed network stack (network.yaml) to import outputs from.

  ContainerPort:
    Type: Number
    Default: 8080

  TaskCpu:
    Type: String
    Default: "256"

  TaskMemory:
    Type: String
    Default: "512"

  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of the CodeStarConnections (GitHub) connection used by CodePipeline
      to source appspec.yaml/taskdef.json from GitHub. Create once via
      Developer Tools > Settings > Connections, authorize the GitHub App,
      then pass its ARN here.

  GitHubOwner:
    Type: String
    Default: EmmanuelSHYIRAMBERE

  GitHubRepo:
    Type: String
    Default: amalitech-python-training

  GitHubBranch:
    Type: String
    Default: feat/ecs-lab-ecs-cicd

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── ECR Repository ─────────────────────────────
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: emmanuel-ecs-lab-app
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      ImageTagMutabilityExclusionFilters:
        # "latest" stays mutable so CodePipeline's ECR source action has a
        # stable tag to watch. Every build also gets a unique, immutable
        # <student>_<app>-<sha> tag for permanent, tamper-proof history.
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-app

  # ── Application Load Balancer ─────────────────
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: emmanuel-ecs-lab-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-AlbSecurityGroupId"
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-alb

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: emmanuel-ecs-lab-tg-blue
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-tg-blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: emmanuel-ecs-lab-tg-green
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-tg-green

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ── ECS Cluster ────────────────────────────────
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: emmanuel-ecs-lab-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-cluster

  # ── CloudWatch Logs ────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/emmanuel-ecs-lab
      RetentionInDays: 14

  # ── IAM: ECS task roles ────────────────────────
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-ecs-lab-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-task-execution-role

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-ecs-lab-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-task-role

  # ── ECS Task Definition ────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: emmanuel-ecs-lab-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ecs-lab-app
          Image: !Sub "${EcrRepository.RepositoryUri}:latest"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ── ECS Service (blue/green via CodeDeploy) ───
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: emmanuel-ecs-lab-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-EcsTaskSecurityGroupId"
      LoadBalancers:
        - ContainerName: ecs-lab-app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-service

  # ── Auto Scaling (target tracking on CPU, 1-4 tasks) ──
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: 1
      MaxCapacity: 4
      ResourceId: !Sub "service/${EcsCluster}/${EcsService.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: emmanuel-ecs-lab-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 50.0

  # ── IAM: CodeDeploy service role ──────────────
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-ecs-lab-codedeploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-codedeploy-role

  # ── CodeDeploy Application + Deployment Group ─
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: emmanuel-ecs-lab-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: emmanuel-ecs-lab-deployment-group
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt EcsService.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref AlbListener
            TargetGroups:
              - Name: !GetAtt BlueTargetGroup.TargetGroupName
              - Name: !GetAtt GreenTargetGroup.TargetGroupName

  # ── CodePipeline artifact bucket ──────────────
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "emmanuel-ecs-lab-pipeline-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-pipeline-artifacts

  # ── IAM: EventBridge → CodePipeline trigger ───
  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-ecs-lab-eventbridge-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipelineExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}"
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-eventbridge-role

  # ── IAM: CodePipeline service role ────────────
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: emmanuel-ecs-lab-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: emmanuel-ecs-lab-pipeline-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${PipelineArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: s3:GetBucketVersioning
                Resource: !GetAtt PipelineArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                  - !GetAtt CodeDeployServiceRole.Arn
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
      Tags:
        - Key: Name
          Value: emmanuel-ecs-lab-pipeline-role

  # ── CodePipeline ───────────────────────────────
  AppPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: emmanuel-ecs-lab-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ImageSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !Ref EcrRepository
                ImageTag: latest
              OutputArtifacts:
                - Name: ImageSourceOutput
              RunOrder: 1
            - Name: DeploySpecSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                DetectChanges: "false"
              OutputArtifacts:
                - Name: DeploySpecOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: DeploySpecOutput
                TaskDefinitionTemplatePath: labs/aws-cloud-and-ai-upskilling/module4/ecs-lab/app/deploy/taskdef.json
                AppSpecTemplateArtifact: DeploySpecOutput
                AppSpecTemplatePath: labs/aws-cloud-and-ai-upskilling/module4/ecs-lab/app/deploy/appspec.yaml
                Image1ArtifactName: ImageSourceOutput
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: ImageSourceOutput
                - Name: DeploySpecOutput
              RunOrder: 1

  # ── EventBridge: ECR push → CodePipeline ──────
  EcrPushEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: emmanuel-ecs-lab-ecr-push-rule
      Description: Triggers the pipeline when a new image is pushed to the ecs-lab ECR repo
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - "ECR Image Action"
        detail:
          action-type:
            - PUSH
          repository-name:
            - !Ref EcrRepository
          result:
            - SUCCESS
      Targets:
        - Arn: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}"
          Id: emmanuel-ecs-lab-pipeline-target
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  AlbDnsName:
    Description: ALB DNS name — use this to access the running application
    Value: !Sub "http://${Alb.DNSName}"

  EcrRepositoryUri:
    Description: ECR repository URI to push images to
    Value: !GetAtt EcrRepository.RepositoryUri

  EcsClusterName:
    Description: ECS cluster name
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: ECS service name
    Value: !GetAtt EcsService.Name

  CodePipelineName:
    Description: CodePipeline name
    Value: !Ref AppPipeline
