<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Emmanuel Shyirambere</h1>
    <h2>To-Do App Lab</h2>

    <form id="task-form">
      <input type="text" id="title" name="title" placeholder="Task title" required />
      <textarea id="description" name="description" placeholder="Description (optional)"></textarea>
      <button type="submit">Add Task</button>
    </form>
    <div id="status"></div>

    <ul class="task-list" id="task-list"></ul>

    <footer>Deployed on Amazon ECS Fargate &mdash; RDS via RDS Proxy &mdash; cached with ElastiCache Redis</footer>

    <script src="app.js"></script>
  </body>
</html>
