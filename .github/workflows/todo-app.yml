name: Build and Push Todo App Image

on:
  push:
    branches: [feat/module6-todo-app]
    paths:
      - "labs/aws-cloud-and-ai-upskilling/module6/todo-app/app/**"
  workflow_dispatch: {}

env:
  ECR_REPOSITORY: ${{ secrets.TODO_APP_ECR_REPOSITORY }}
  PIPELINE_ARTIFACT_BUCKET: ${{ secrets.TODO_APP_PIPELINE_BUCKET }}
  DEPLOY_SPEC_S3_KEY: deploy-spec/deploy-spec.zip

jobs:
  build-and-push:
    name: Build, Upload Deploy Spec, and Push Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to AWS and ECR
        id: login-ecr
        uses: ./.github/actions/aws-ecr-auth
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-arn: ${{ secrets.TODO_APP_AWS_ROLE_ARN }}

      - name: Build image
        run: |
          docker build \
            -t local/todo-app:build \
            labs/aws-cloud-and-ai-upskilling/module6/todo-app/app

      # Uploaded BEFORE the image push below, since EventBridge triggers
      # the pipeline off the ECR push - the deploy-spec zip must already
      # exist in S3 by the time that happens, or the pipeline's S3 source
      # action would read a stale (or missing) object.
      - name: Zip and upload deploy spec to S3
        run: |
          cd labs/aws-cloud-and-ai-upskilling/module6/todo-app/app/deploy
          zip deploy-spec.zip appspec.yaml taskdef.json
          aws s3 cp deploy-spec.zip \
            "s3://${PIPELINE_ARTIFACT_BUCKET}/${DEPLOY_SPEC_S3_KEY}"

      - name: Tag and push image as latest
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag local/todo-app:build $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:latest
