name: Deploy Todo App Infrastructure

# Deploys the nested-stack CloudFormation architecture for the To-Do App
# Lab: syncs the 6 child templates to S3, then deploys/updates the root
# stack, which references them via TemplateURL.
#
# One-time manual prerequisites (not automated here, since the templates
# bucket must exist before the root stack can reference anything inside
# it — a chicken-and-egg problem no workflow run can solve on its own):
#   1. Create the S3 bucket referenced by TEMPLATES_BUCKET below
#      (versioned, private), e.g.:
#        aws s3api create-bucket --bucket <name> --region <region> \
#          --create-bucket-configuration LocationConstraint=<region>
#        aws s3api put-bucket-versioning --bucket <name> \
#          --versioning-configuration Status=Enabled
#   2. Grant the OIDC role assumed below (secrets.TODO_APP_AWS_ROLE_ARN)
#      s3:PutObject/s3:ListBucket on that bucket, and
#      cloudformation:* + iam:PassRole (scoped as appropriate) on the
#      emmanuel-todo-app root stack and its nested stacks.

on:
  push:
    branches: [feat/module6-todo-app]
    paths:
      - "labs/aws-cloud-and-ai-upskilling/module6/todo-app/infra/**"
  workflow_dispatch: {}

env:
  TEMPLATES_BUCKET: ${{ secrets.TODO_APP_TEMPLATES_BUCKET }}
  TEMPLATES_PREFIX: templates/
  INFRA_DIR: labs/aws-cloud-and-ai-upskilling/module6/todo-app/infra
  ROOT_STACK_NAME: emmanuel-todo-app

jobs:
  deploy-infra:
    name: Sync Templates and Deploy Root Stack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/aws-oidc-auth
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-arn: ${{ secrets.TODO_APP_AWS_ROLE_ARN }}

      # Every child template except root.yaml itself (root.yaml is
      # deployed directly from the local checkout by `aws cloudformation
      # deploy` below, not referenced by TemplateURL, so it never needs
      # to live in S3).
      - name: Sync child templates to S3
        run: |
          for f in network database cache ecr alb-ecs pipeline; do
            aws s3 cp \
              "${INFRA_DIR}/${f}.yaml" \
              "s3://${TEMPLATES_BUCKET}/${TEMPLATES_PREFIX}${f}.yaml"
          done

      - name: Deploy root stack
        run: |
          aws cloudformation deploy \
            --stack-name "${ROOT_STACK_NAME}" \
            --template-file "${INFRA_DIR}/root.yaml" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              TemplatesBucketName="${TEMPLATES_BUCKET}" \
              TemplatesPrefix="${TEMPLATES_PREFIX}"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${ROOT_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table
