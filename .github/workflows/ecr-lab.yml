name: Build and Push to ECR

on:
  push:
    branches: [feat/ecr-lab-docker-push]
    paths:
      - "labs/aws-cloud-and-ai-upskilling/module4/ecr-lab/app/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG_PREFIX: emmanuelshyirambere_itemsapi

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHA_TAG="${IMAGE_TAG_PREFIX}-${GITHUB_SHA::7}"
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$SHA_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            labs/aws-cloud-and-ai-upskilling/module4/ecr-lab/app
          docker push $REGISTRY/$ECR_REPOSITORY:$SHA_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
