name: Build and Push ECS Lab Image

on:
  push:
    branches: [feat/ecs-lab-ecs-cicd]
    paths:
      - "labs/aws-cloud-and-ai-upskilling/module4/ecs-lab/app/**"
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECS_LAB_ECR_REPOSITORY }}
  IMAGE_TAG: emmanuelshyirambere_ecslab

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECS_LAB_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            labs/aws-cloud-and-ai-upskilling/module4/ecs-lab/app
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
